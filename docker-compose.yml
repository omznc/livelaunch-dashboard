services:
    web:
        image: livelaunch
        restart: unless-stopped
        ports:
            - "3000:3000"
        env_file:
            - .env
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3
